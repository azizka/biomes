url: https://azizka.github.io/biomes/

template:
  bootstrap: 5

authors:
  footer:
    roles: [cre]
    text: "Developed by"

home:
  title: 'biomes: An R package for reproducible occurrence-to-biome classification using 31 global biome schemes'
  description: >
    biomes provides 31 published global biome schemes (Fischer
    et al. 2022) as harmonised raster layers at 10x10 km resolution, plus
    functions to rank the schemes for a dataset, classify occurrence records
    into biomes, and tabulate and visualise the result.

reference:
- title: Biome data
  desc: Load raster layers and metadata shipped with the package.
  contents:
  - biomes_download
  - biomes_get
  - biomes_info
  - biomes_information
  - biomes_legend
  - bombacoideae_occurrences
- title: Get occurrences from GBIF
  desc: Download and clean GBIF occurrences for a taxon.
  contents:
  - biomes_occ
- title: Classify and summarize occurrences
  contents:
  - biomes_classify
  - biomes_tab
- title: Rank biome schemes for a dataset
  desc: Data-driven scoring of the 31 biome schemes for a given occurrence set.
  contents:
  - biomes_rank
- title: Visualise
  desc: Ranking, occurrence map and biome composition for a chosen scheme.
  contents:
  - biomes_visualise
- title: One-call workflow
  desc: Single-call wrapper from taxon or dataset to table + map.
  contents:
  - biomes_full

articles:
- title: The four-step workflow
  navbar: ~
  contents:
  - step1-assembly-of-occurrence-records-and-biome-schemes
  - step2-choice-of-a-biome-scheme
  - step3-occurrence-to-biome-classification
  - step4-output-and-visualisation
